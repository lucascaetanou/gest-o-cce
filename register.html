<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline'; font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self' https://aodzyrsmzuqkoxvhwdqz.supabase.co wss://aodzyrsmzuqkoxvhwdqz.supabase.co https://cdn.jsdelivr.net; img-src 'self' data: https:;">
  <title>Cadastro | Gestão CCE</title>
  <meta name="description" content="Acesso à plataforma de gestão do Centro de Ciências Exatas">
  <link rel="icon" type="image/png" href="assets/logo.png?v=6">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <div class="auth-wrapper">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    
    <div class="auth-card" style="max-width:480px">
      <div class="auth-logo-wrapper">
        <img src="assets/logo.png?v=6" onerror="this.onerror=null; this.src=\'logo.png\';" alt="Gestão CCE" class="auth-logo-img">
      </div>
      <h1 class="auth-title">Criar Conta</h1>
      <p class="auth-subtitle">Solicite acesso à plataforma</p>
      
      <div id="alertMessage" class="alert"></div>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Nome Completo</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="name" required placeholder="João Silva">
          </div>
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" required placeholder="seu@email.com">
          </div>
        </div>
        <div class="form-group">
          <label for="phone">Telefone</label>
          <div class="input-wrapper">
            <i class="fas fa-phone"></i>
            <input type="tel" id="phone" required placeholder="(00) 00000-0000">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
          </div>
          <div id="passwordStrength" class="password-strength"><div class="bar"></div></div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="btnSubmit">
          <span>Solicitar Acesso</span>
          <i class="fas fa-paper-plane"></i>
        </button>
      </form>
      
      <p class="auth-link">Já tem conta? <a href="index.html">Fazer Login</a></p>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js?v=2"></script>
</body>
</html>
