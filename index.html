<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline'; font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self' https://aodzyrsmzuqkoxvhwdqz.supabase.co wss://aodzyrsmzuqkoxvhwdqz.supabase.co https://cdn.jsdelivr.net; img-src 'self' data: https:;">
  <title>Login | Gestão CCE</title>
  <meta name="description" content="Acesso à plataforma de gestão do Centro de Ciências Exatas">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <!-- Decorative floating orbs for depth -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    
    <div class="auth-card">
      <div class="auth-logo-wrapper">
        <img src="assets/logo.png" alt="Gestão CCE" class="auth-logo-img">
      </div>
      <h1 class="auth-title">Gestão CCE</h1>
      <p class="auth-subtitle">Centro de Ciências Exatas</p>
      
      <div id="alertMessage" class="alert"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" name="email" required placeholder="seu@email.com">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" required placeholder="••••••••">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="btnSubmit">
          <span>Entrar</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>
      
      <p class="auth-link">Não possui conta? <a href="register.html">Cadastre-se</a></p>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js?v=2"></script>
</body>
</html>
